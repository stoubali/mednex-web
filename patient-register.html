<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Inscription Patient - MedNex</title>
<link rel="icon" href="/chismya.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{ margin:0; padding:0; box-sizing:border-box; }
body{ font-family:'Inter','Segoe UI',sans-serif; background:linear-gradient(135deg,rgba(11,61,46,0.88),rgba(6,43,32,0.85)), url('https://images.unsplash.com/photo-1576091160550-2173dba999ef?ixlib=rb-4.0.3&auto=format&fit=crop&w=2070&q=80') no-repeat center center/cover; min-height:100vh; display:flex; justify-content:center; align-items:center; padding:30px 15px; }
:root{ --med-primary:#0B3D2E; --med-primary-light:#1e6b50; --med-accent:#2c7a5e; --med-text-light:#4a5a6e; }
.register-card{ width:100%; max-width:560px; background:rgba(255,255,255,0.98); padding:44px 40px; border-radius:40px; box-shadow:0 30px 50px rgba(0,0,0,0.2); animation:fadeUp 0.6s cubic-bezier(0.2,0.9,0.4,1.1); border:1px solid rgba(11,61,46,0.1); }
.register-header{ text-align:center; margin-bottom:32px; }
.logo{ width:100px; margin-bottom:20px; filter:drop-shadow(0 4px 8px rgba(0,0,0,0.1)); border-radius:16px; display:inline-block; }
.register-header h2{ color:var(--med-primary); font-size:2rem; font-weight:800; margin-bottom:12px; }
.register-header p{ color:var(--med-text-light); line-height:1.5; font-size:0.95rem; }
.register-form{ display:flex; flex-direction:column; gap:18px; }
.input-group{ display:flex; flex-direction:column; }
.input-group label{ margin-bottom:8px; color:var(--med-primary); font-weight:700; font-size:0.9rem; display:flex; align-items:center; gap:8px; }
.input-group label i{ font-size:0.9rem; color:var(--med-accent); }
.register-form input,.register-form select{ width:100%; padding:14px 20px; border-radius:28px; border:1.5px solid #e2ece6; font-size:0.95rem; font-family:inherit; outline:none; transition:all 0.25s ease; }
.register-form input:focus,.register-form select:focus{ border-color:var(--med-accent); box-shadow:0 0 0 4px rgba(44,122,94,0.12); }
.register-form button{ width:100%; padding:15px; border:none; border-radius:60px; background:linear-gradient(95deg,var(--med-accent),var(--med-primary-light)); color:white; font-size:1rem; font-weight:800; font-family:inherit; cursor:pointer; transition:all 0.3s ease; margin-top:8px; box-shadow:0 8px 20px rgba(44,122,94,0.3); display:flex; align-items:center; justify-content:center; gap:10px; }
.register-form button:hover{ transform:translateY(-2px); box-shadow:0 14px 28px rgba(44,122,94,0.4); }
.register-form button:disabled{ opacity:0.65; cursor:not-allowed; transform:none; }
.bottom-links{ margin-top:28px; display:flex; flex-direction:column; align-items:center; gap:12px; }
.back-home{ color:var(--med-accent); text-decoration:none; font-weight:600; font-size:0.9rem; display:inline-flex; align-items:center; gap:6px; }
.back-home:hover{ text-decoration:underline; color:var(--med-primary); }
.login-link{ color:var(--med-text-light); font-size:0.9rem; font-weight:500; }
.login-link a{ color:var(--med-accent); text-decoration:none; font-weight:700; margin-left:4px; }
.success-box{ display:none; background:#dcfce7; color:#166534; padding:14px 18px; border-radius:24px; margin-bottom:22px; font-size:0.9rem; font-weight:600; border-left:4px solid #22c55e; text-align:left; }
.error-box{ display:none; background:#ffe8e8; color:#dc2626; padding:14px 18px; border-radius:24px; margin-bottom:22px; font-size:0.9rem; font-weight:600; border-left:4px solid #dc2626; text-align:left; }
@keyframes fadeUp{ from{ opacity:0; transform:translateY(30px); } to{ opacity:1; transform:translateY(0); } }
@media(max-width:480px){ .register-card{ padding:28px 20px; border-radius:28px; } .register-header h2{ font-size:1.6rem; } }
</style>
</head>
<body>
<div class="register-card">
  <div class="register-header">
    <img src="/image-removebg-preview.png" alt="MedNex" class="logo"
      onerror="this.src='https://placehold.co/400x120/0B3D2E/white?text=MedNex'">
    <h2>Inscription Patient</h2>
    <p>Créez votre compte MedNex pour réserver<br>facilement vos consultations médicales.</p>
  </div>

  <div id="successBox" class="success-box"><i class="fas fa-check-circle"></i> <span></span></div>
  <div id="errorBox"   class="error-box"><i class="fas fa-exclamation-triangle"></i> <span></span></div>

  <form class="register-form" id="registerForm">
    <div class="input-group"><label><i class="fas fa-user"></i> Nom complet</label><input name="full_name" type="text" placeholder="Entrez votre nom complet" required></div>
    <div class="input-group"><label><i class="fas fa-envelope"></i> Adresse Email</label><input name="email" type="email" placeholder="exemple@mednex.com" required autocomplete="email"></div>
    <div class="input-group"><label><i class="fas fa-phone-alt"></i> Téléphone</label><input name="phone" type="tel" placeholder="+212 6XX XXX XXX" required></div>
    <div class="input-group"><label><i class="fas fa-calendar-alt"></i> Date de naissance</label><input name="birth_date" type="date" required></div>
    <div class="input-group"><label><i class="fas fa-venus-mars"></i> Sexe</label>
      <select name="gender" required>
        <option value="">Sélectionnez votre sexe</option>
        <option value="Homme">Homme</option>
        <option value="Femme">Femme</option>
      </select>
    </div>
    <div class="input-group"><label><i class="fas fa-lock"></i> Mot de passe</label><input name="password" type="password" placeholder="Minimum 8 caractères" required autocomplete="new-password"></div>
    <button type="submit" id="submitBtn"><i class="fas fa-arrow-right-to-bracket"></i> Créer un Compte</button>
  </form>

  <div class="bottom-links">
    <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Retour à l'accueil</a>
    <div class="login-link">Vous avez déjà un compte ?<a href="patient-login.html">Connectez-vous ici</a></div>
  </div>
</div>

<script>
const { createClient } = supabase;
const sb = createClient(
  "https://xisdwbyermvbqjuqjagn.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhpc2R3Ynllcm12YnFqdXFqYWduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1MzUyOTksImV4cCI6MjA5ODExMTI5OX0.Ixz6hlLsOUkH04uNivcH81P4-MWeIc_pJZTwnAfm57I"
);

const form       = document.getElementById("registerForm");
const successBox = document.getElementById("successBox");
const errorBox   = document.getElementById("errorBox");
const submitBtn  = document.getElementById("submitBtn");

function showSuccess(msg){ successBox.querySelector("span").textContent=msg; successBox.style.display="block"; errorBox.style.display="none"; successBox.scrollIntoView({behavior:"smooth",block:"nearest"}); }
function showError(msg){ errorBox.querySelector("span").textContent=msg; errorBox.style.display="block"; successBox.style.display="none"; errorBox.scrollIntoView({behavior:"smooth",block:"nearest"}); }
function hideAlerts(){ successBox.style.display="none"; errorBox.style.display="none"; }

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  hideAlerts();

  const d = Object.fromEntries(new FormData(form).entries());
  d.full_name = d.full_name?.trim();
  d.email     = d.email?.trim();
  d.phone     = d.phone?.trim();

  if (!d.full_name || d.full_name.length < 3)  { showError("Nom complet invalide (min 3 caractères)"); return; }
  if (!/^[^\s@]+@([^\s@.,]+\.)+[^\s@.,]{2,}$/.test(d.email)) { showError("Email invalide"); return; }
  if (!d.phone || d.phone.length < 9)           { showError("Numéro de téléphone invalide"); return; }
  if (!d.birth_date)                            { showError("Date de naissance requise"); return; }
  if (!d.gender)                                { showError("Sexe requis"); return; }
  if (!d.password || d.password.length < 8)    { showError("Le mot de passe doit contenir au moins 8 caractères"); return; }

  submitBtn.disabled = true;
  submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Création…';

  try {
    // 1. Create auth user (password hashed by Supabase — never plain text)
    const { data: authData, error: authError } = await sb.auth.signUp({
  email: d.email,
  password: d.password,
  options: {
    emailRedirectTo: null,
    data: { role: "patient", full_name: d.full_name }
  }
});

    if (authError) {
      showError(authError.message.includes("already registered")
        ? "Cet email est déjà utilisé. Veuillez vous connecter."
        : "Erreur: " + authError.message);
      return;
    }

    const authUserId = authData.user.id;

    // 2. Insert patient profile linked to auth user (NO password stored)
    const { error: insertError } = await sb.from("patients").insert([{
      auth_user_id: authUserId,
      full_name:    d.full_name,
      email:        d.email,
      phone:        d.phone,
      birth_date:   d.birth_date,
      gender:       d.gender
      // ⚠️  NO password field
    }]);

    if (insertError) {
      showError("Erreur lors de l'inscription: " + insertError.message);
      return;
    }

    showSuccess("Compte créé ✅ Bienvenue sur MedNex ! Vous pouvez maintenant vous connecter.");
    form.reset();
    // Don't redirect — let them read the message

  } catch (err) {
    console.error(err);
    showError("Erreur inattendue. Veuillez réessayer.");
  } finally {
    submitBtn.disabled = false;
    submitBtn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Créer un Compte';
  }
});

document.querySelectorAll(".register-form input, .register-form select")
  .forEach(el => el.addEventListener("focus", hideAlerts));
</script>
</body>
</html>
