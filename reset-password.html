<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedNex · Reset Password</title>
  <!-- Poppins & Inter (fallback) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" href="/chismya.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome (show/hide icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ----- RESET & BASE ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #F7F9F8;
      font-family: 'Poppins', 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      margin: 0;
    }

    /* ----- AUTH CARD ----- */
    .auth-card {
      background: #ffffff;
      max-width: 440px;
      width: 100%;
      padding: 2.5rem 2.2rem;
      border-radius: 32px;
      box-shadow: 0 20px 40px -12px rgba(15, 90, 67, 0.15), 0 8px 24px -6px rgba(0, 0, 0, 0.05);
      transition: box-shadow 0.25s ease, transform 0.25s ease;
      animation: cardFadeIn 0.5s ease-out;
    }

    @keyframes cardFadeIn {
      0% { opacity: 0; transform: translateY(12px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ----- LOGO (MedNex) using navbar image ----- */
    .logo-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .mednex-logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
    }

    .logo-image {
      height: 44px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    /* fallback text (if image fails) */
    .logo-text-fallback {
      font-size: 1.6rem;
      font-weight: 700;
      color: #0F5A43;
      letter-spacing: -0.5px;
    }
    .logo-text-fallback span {
      font-weight: 300;
      color: #7BE3A3;
    }

    /* ----- TYPOGRAPHY ----- */
    .card-title {
      font-size: 1.7rem;
      font-weight: 600;
      color: #0F5A43;
      text-align: center;
      letter-spacing: -0.3px;
      margin-bottom: 0.4rem;
    }

    .card-subtitle {
      font-size: 0.95rem;
      font-weight: 400;
      color: #4b5e5a;
      text-align: center;
      margin-bottom: 2rem;
      line-height: 1.4;
    }

    /* ----- FORM ELEMENTS ----- */
    .input-group {
      margin-bottom: 1.25rem;
    }

    .input-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: #1d2f2b;
      margin-bottom: 0.4rem;
      letter-spacing: 0.3px;
    }

    .password-field {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-field input {
      width: 100%;
      padding: 0.9rem 1rem;
      padding-right: 3rem;
      border: 1.5px solid #e2eae7;
      border-radius: 16px;
      font-family: 'Inter', 'Poppins', sans-serif;
      font-size: 0.95rem;
      background: #F7F9F8;
      transition: border-color 0.2s, box-shadow 0.2s;
      color: #0c2b24;
    }

    .password-field input:focus {
      outline: none;
      border-color: #0F5A43;
      box-shadow: 0 0 0 4px rgba(15, 90, 67, 0.08);
      background: #ffffff;
    }

    .password-field input::placeholder {
      color: #a0b3ae;
      font-weight: 400;
    }

    .toggle-password {
      position: absolute;
      right: 1rem;
      background: transparent;
      border: none;
      color: #0F5A43;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .toggle-password:hover {
      color: #7BE3A3;
    }

    .toggle-password:focus-visible {
      outline: 2px solid #0F5A43;
      border-radius: 30px;
    }

    /* ----- INLINE ERROR (match) ----- */
    .match-error {
      font-size: 0.8rem;
      color: #c53e3e;
      margin-top: 0.3rem;
      min-height: 1.4rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      transition: opacity 0.2s;
    }

    .match-error i {
      font-size: 0.8rem;
    }

    .match-error.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* ----- RESET BUTTON ----- */
    .reset-btn {
      width: 100%;
      padding: 0.9rem;
      background: #0F5A43;
      border: none;
      border-radius: 40px;
      font-family: 'Poppins', 'Inter', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      color: white;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 8px 18px -6px rgba(15, 90, 67, 0.25);
      margin-top: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .reset-btn:hover:not(:disabled) {
      background: #0b4a36;
      box-shadow: 0 10px 22px -8px rgba(15, 90, 67, 0.35);
    }

    .reset-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .reset-btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    /* loading spinner inside button */
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2.5px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
      margin-right: 4px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ----- SUCCESS MESSAGE (green check) ----- */
    .success-message {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.2rem 0.5rem 0.2rem;
      text-align: center;
      animation: successPop 0.45s ease-out;
    }

    .success-message.show {
      display: flex;
    }

    @keyframes successPop {
      0% { opacity: 0; transform: scale(0.92); }
      100% { opacity: 1; transform: scale(1); }
    }

    .success-icon {
      background: #7BE3A3;
      color: #0F5A43;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      box-shadow: 0 8px 16px rgba(123, 227, 163, 0.25);
      margin-bottom: 0.8rem;
    }

    .success-message h3 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #0F5A43;
      margin-bottom: 0.2rem;
    }

    .success-message p {
      color: #3a5a52;
      font-size: 0.9rem;
      font-weight: 400;
    }

    /* ----- RESPONSIVE ----- */
    @media (max-width: 480px) {
      .auth-card {
        padding: 2rem 1.2rem;
        border-radius: 28px;
      }
      .card-title {
        font-size: 1.4rem;
      }
      .logo-image {
        height: 38px;
      }
      .password-field input {
        padding: 0.8rem 1rem;
        padding-right: 3rem;
        font-size: 0.9rem;
      }
      .reset-btn {
        padding: 0.8rem;
      }
    }

    @media (max-width: 360px) {
      .auth-card {
        padding: 1.5rem 1rem;
      }
    }

    /* utilities */
    .hidden {
      display: none !important;
    }
    .mt-1 { margin-top: 0.25rem; }
  </style>
</head>
<body>
  <div class="auth-card" role="main" aria-labelledby="reset-title">
    <!-- MedNex Logo · using logo_navbar.png -->
    <div class="logo-wrapper">
      <div class="mednex-logo">
        <img src="/logo_navbar.png" alt="MedNex logo" class="logo-image" />
        <!-- fallback text if image fails (hidden by default) -->
        <span class="logo-text-fallback" style="display:none;">Med<span>Nex</span></span>
      </div>
    </div>

    <!-- Titles -->
    <h1 id="reset-title" class="card-title">Reset Your Password</h1>
    <p class="card-subtitle">Enter your new password to continue.</p>

    <!-- Form (no real submit) -->
    <form id="resetForm" novalidate>
      <!-- New Password -->
      <div class="input-group">
        <label for="newPassword">New password</label>
        <div class="password-field">
          <input type="password" id="newPassword" placeholder="••••••••" autocomplete="new-password" aria-describedby="newPasswordToggle">
          <button type="button" class="toggle-password" id="toggleNew" aria-label="Toggle new password visibility" tabindex="0">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="input-group">
        <label for="confirmPassword">Confirm password</label>
        <div class="password-field">
          <input type="password" id="confirmPassword" placeholder="••••••••" autocomplete="new-password" aria-describedby="confirmPasswordToggle">
          <button type="button" class="toggle-password" id="toggleConfirm" aria-label="Toggle confirm password visibility" tabindex="0">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <!-- inline match error -->
        <div id="matchError" class="match-error hidden">
          <i class="fas fa-exclamation-circle"></i> Passwords do not match
        </div>
      </div>

      <!-- Reset Button -->
      <button type="submit" id="resetBtn" class="reset-btn" disabled>
        Reset Password
      </button>
    </form>

    <!-- Success message (hidden by default) -->
    <div id="successMessage" class="success-message">
      <div class="success-icon"><i class="fas fa-check"></i></div>
      <h3>Password updated</h3>
      <p>Your password has been reset successfully.</p>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      // DOM refs
      const newPassInput = document.getElementById('newPassword');
      const confirmPassInput = document.getElementById('confirmPassword');
      const matchError = document.getElementById('matchError');
      const resetBtn = document.getElementById('resetBtn');
      const resetForm = document.getElementById('resetForm');
      const successMessage = document.getElementById('successMessage');
      const authCard = document.querySelector('.auth-card');

      // toggle buttons
      const toggleNew = document.getElementById('toggleNew');
      const toggleConfirm = document.getElementById('toggleConfirm');

      // ----- helper: toggle password visibility -----
      function togglePasswordVisibility(input, toggleBtn) {
        const isPassword = input.getAttribute('type') === 'password';
        input.setAttribute('type', isPassword ? 'text' : 'password');
        const icon = toggleBtn.querySelector('i');
        if (isPassword) {
          icon.classList.remove('fa-eye');
          icon.classList.add('fa-eye-slash');
        } else {
          icon.classList.remove('fa-eye-slash');
          icon.classList.add('fa-eye');
        }
      }

      toggleNew.addEventListener('click', function(e) {
        e.preventDefault();
        togglePasswordVisibility(newPassInput, toggleNew);
      });
      toggleConfirm.addEventListener('click', function(e) {
        e.preventDefault();
        togglePasswordVisibility(confirmPassInput, toggleConfirm);
      });

      // ----- validation: only check match + both filled -----
      function validateMatch() {
        const newVal = newPassInput.value;
        const confirmVal = confirmPassInput.value;
        const bothFilled = newVal.length > 0 && confirmVal.length > 0;
        const match = newVal === confirmVal;

        // show/hide error message
        if (bothFilled && !match) {
          matchError.classList.remove('hidden');
        } else {
          matchError.classList.add('hidden');
        }

        // enable button only if both filled AND match
        if (bothFilled && match) {
          resetBtn.disabled = false;
        } else {
          resetBtn.disabled = true;
        }
      }

      // attach input events
      newPassInput.addEventListener('input', validateMatch);
      confirmPassInput.addEventListener('input', validateMatch);

      // also on page load (ensure button disabled)
      validateMatch();

      // ----- form submit: simulate loading + success -----
      resetForm.addEventListener('submit', function(e) {
        e.preventDefault();

        // double-check match (in case of weird state)
        if (resetBtn.disabled) return;

        // disable button and show loading spinner
        resetBtn.disabled = true;
        const originalText = resetBtn.innerHTML;
        resetBtn.innerHTML = '<span class="spinner"></span> Resetting…';

        // simulate async operation (frontend-only)
        setTimeout(function() {
          // hide form, show success message
          resetForm.style.display = 'none';
          successMessage.classList.add('show');

          // restore button (not needed but good practice)
          resetBtn.innerHTML = originalText;
          resetBtn.disabled = false; // will be hidden anyway

          // optional: small extra animation on card
          authCard.style.transition = 'box-shadow 0.3s';
          authCard.style.boxShadow = '0 20px 40px -12px rgba(15, 90, 67, 0.25)';
        }, 1500); // 1.5s loading simulation
      });

      // reset success state if user types again? not needed; but we can keep it clean.
      // If they want to reset again, they'd reload. This is frontend-only.

      // extra: if user presses Enter on inputs, it triggers submit
      // handle edge: prevent accidental double-submit
      // also ensure matchError hidden on success? fine.

      // Also re-validate if user pastes via mouse (input event catches)
      console.log('MedNex Reset Password — frontend only (logo_navbar.png)');
    })();
  </script>
</body>
</html>
