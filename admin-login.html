<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Accès Administration - MedNex</title>
<link rel="icon" href="/chismya.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{ margin:0; padding:0; box-sizing:border-box; }

:root{
  --primary:#0B3D2E;
  --primary-light:#1e6b50;
  --accent:#2c7a5e;
  --text-light:#4a5a6e;
  --border:#e2ece6;
}

body{
  font-family:'Inter','Segoe UI',sans-serif;
  background:
    linear-gradient(135deg, rgba(6,20,14,0.92), rgba(11,61,46,0.88)),
    url('https://images.unsplash.com/photo-1576091160550-2173dba999ef?ixlib=rb-4.0.3&auto=format&fit=crop&w=2070&q=80')
    no-repeat center center / cover;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:24px 16px;
}

/* ── Card ── */
.card{
  width:100%;
  max-width:440px;
  background:rgba(255,255,255,0.98);
  border-radius:36px;
  padding:48px 40px 40px;
  box-shadow:0 40px 60px rgba(0,0,0,0.28), 0 0 0 1px rgba(11,61,46,0.08);
  animation:fadeUp 0.55s cubic-bezier(0.2,0.9,0.4,1.1) both;
}

@keyframes fadeUp{
  from{ opacity:0; transform:translateY(28px); }
  to  { opacity:1; transform:translateY(0); }
}

/* ── Header ── */
.header{ text-align:center; margin-bottom:36px; }

.logo-wrap{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin-bottom:20px;
}

.logo-wrap img{
  height:52px;
  object-fit:contain;
  border-radius:12px;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,0.12));
}

.admin-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:linear-gradient(95deg, var(--primary), var(--accent));
  color:white;
  font-size:0.65rem;
  font-weight:700;
  letter-spacing:1.2px;
  text-transform:uppercase;
  padding:4px 14px;
  border-radius:60px;
  margin-bottom:14px;
}

.header h2{
  color:var(--primary);
  font-size:1.8rem;
  font-weight:800;
  letter-spacing:-0.5px;
  margin-bottom:6px;
}

.header p{
  color:var(--text-light);
  font-size:0.9rem;
  line-height:1.5;
}

/* ── Shield icon decoration ── */
.shield-wrap{
  width:64px;
  height:64px;
  background:linear-gradient(135deg, var(--primary), var(--accent));
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 18px;
  box-shadow:0 12px 28px rgba(11,61,46,0.3);
}

.shield-wrap i{
  font-size:1.6rem;
  color:white;
}

/* ── Form ── */
.form{ display:flex; flex-direction:column; gap:18px; }

.input-group{ display:flex; flex-direction:column; }

.input-group label{
  margin-bottom:7px;
  color:var(--primary);
  font-weight:700;
  font-size:0.82rem;
  display:flex;
  align-items:center;
  gap:7px;
  text-transform:uppercase;
  letter-spacing:0.4px;
}

.input-group label i{
  color:var(--accent);
  font-size:0.82rem;
}

.input-wrap{ position:relative; }

.input-wrap input{
  width:100%;
  padding:14px 44px 14px 18px;
  border-radius:26px;
  border:1.5px solid var(--border);
  font-size:0.92rem;
  font-family:inherit;
  outline:none;
  transition:all 0.22s ease;
  background:#fafcfb;
  color:#0b1e18;
}

.input-wrap input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(44,122,94,0.1);
  background:white;
}

.toggle-pw{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  background:none;
  border:none;
  cursor:pointer;
  color:#8a9e96;
  font-size:0.9rem;
  padding:4px;
  transition:color 0.2s;
}

.toggle-pw:hover{ color:var(--accent); }

/* ── Error box ── */
#errorBox{
  display:none;
  background:#fff0f0;
  color:#c53030;
  padding:12px 16px;
  border-radius:20px;
  font-size:0.85rem;
  font-weight:600;
  border-left:4px solid #ef4444;
  align-items:center;
  gap:8px;
}

/* ── Submit button ── */
.login-btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:60px;
  background:linear-gradient(95deg, var(--accent), var(--primary-light));
  color:white;
  font-size:0.95rem;
  font-weight:800;
  font-family:inherit;
  cursor:pointer;
  transition:all 0.28s ease;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  box-shadow:0 8px 22px rgba(44,122,94,0.35);
  margin-top:4px;
}

.login-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 14px 30px rgba(44,122,94,0.45);
}

.login-btn:disabled{
  opacity:0.6;
  cursor:not-allowed;
  transform:none;
}

/* ── Lockout message ── */
#lockoutBox{
  display:none;
  text-align:center;
  padding:12px 16px;
  background:#fff7ed;
  border-radius:20px;
  font-size:0.82rem;
  color:#c2410c;
  font-weight:600;
  border-left:4px solid #f97316;
}

/* ── Footer ── */
.footer-link{
  display:block;
  text-align:center;
  margin-top:24px;
  color:var(--accent);
  font-size:0.85rem;
  font-weight:600;
  text-decoration:none;
  transition:color 0.2s;
}

.footer-link:hover{ color:var(--primary); text-decoration:underline; }

/* ── Attempts dots ── */
.attempts-wrap{
  display:flex;
  justify-content:center;
  gap:6px;
  margin-top:6px;
}

.attempt-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--border);
  transition:background 0.3s;
}

.attempt-dot.used{ background:#ef4444; }

/* ── Shake animation ── */
@keyframes shake{
  0%,100%{ transform:translateX(0); }
  20%{ transform:translateX(-8px); }
  40%{ transform:translateX(8px); }
  60%{ transform:translateX(-5px); }
  80%{ transform:translateX(5px); }
}
.shake{ animation:shake 0.4s ease; }

@media(max-width:480px){
  .card{ padding:32px 22px 28px; border-radius:28px; }
  .header h2{ font-size:1.5rem; }
}
</style>
</head>
<body>

<div class="card" id="loginCard">

  <!-- Header -->
  <div class="header">
    <div class="logo-wrap">
      <img src="/logo_navbar.png" alt="MedNex"
        onerror="this.src='https://placehold.co/200x60/0B3D2E/white?text=MedNex'">
    </div>
    <div class="shield-wrap">
      <i class="fas fa-shield-halved"></i>
    </div>
    <div class="admin-pill"><i class="fas fa-crown"></i> Accès Restreint</div>
    <h2>Administration</h2>
    <p>Espace directeur · Accès sécurisé<br>aux données et contrôles de la plateforme.</p>
  </div>

  <!-- Error -->
  <div id="errorBox">
    <i class="fas fa-triangle-exclamation"></i>
    <span id="errorMsg">Identifiants incorrects.</span>
  </div>

  <!-- Lockout -->
  <div id="lockoutBox">
    <i class="fas fa-lock"></i>
    Trop de tentatives. Réessayez dans <span id="lockTimer">60</span>s.
  </div>

  <!-- Form -->
  <form class="form" id="loginForm" autocomplete="off">

    <div class="input-group">
      <label><i class="fas fa-user-shield"></i> Email administrateur</label>
      <div class="input-wrap">
        <input
          type="email"
          id="username"
          placeholder="admin@mednex.com"
          autocomplete="off"
          spellcheck="false"
          required
        >
      </div>
    </div>

    <div class="input-group">
      <label><i class="fas fa-key"></i> Mot de passe</label>
      <div class="input-wrap">
        <input
          type="password"
          id="password"
          placeholder="••••••••••••"
          autocomplete="new-password"
          required
        >
        <button type="button" class="toggle-pw" id="togglePw" tabindex="-1">
          <i class="fas fa-eye" id="eyeIcon"></i>
        </button>
      </div>
    </div>

    <!-- Attempt dots (3 tries before lockout) -->
    <div class="attempts-wrap" id="attemptDots" style="display:none;">
      <div class="attempt-dot" id="dot1"></div>
      <div class="attempt-dot" id="dot2"></div>
      <div class="attempt-dot" id="dot3"></div>
    </div>

    <button type="submit" class="login-btn" id="loginBtn">
      <i class="fas fa-arrow-right-to-bracket"></i>
      Accéder au tableau de bord
    </button>

  </form>

  <a href="index.html" class="footer-link">
    <i class="fas fa-arrow-left"></i> Retour à l'accueil
  </a>

</div>

<script>
// ── Real Supabase Auth (no more hardcoded creds) ────────────────
const SUPABASE_URL = "https://xisdwbyermvbqjuqjagn.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhpc2R3Ynllcm12YnFqdXFqYWduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1MzUyOTksImV4cCI6MjA5ODExMTI5OX0.Ixz6hlLsOUkH04uNivcH81P4-MWeIc_pJZTwnAfm57I";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const SESSION_KEY = 'mednex_admin_auth';
const MAX_TRIES = 3;
const LOCKOUT_SECONDS = 60;

// ── State ──────────────────────────────────────────────────────
let failedAttempts = parseInt(sessionStorage.getItem('admin_fails') || '0');
let lockedUntil    = parseInt(sessionStorage.getItem('admin_lock')  || '0');

// ── DOM refs ───────────────────────────────────────────────────
const form      = document.getElementById('loginForm');
const loginBtn  = document.getElementById('loginBtn');
const errorBox  = document.getElementById('errorBox');
const errorMsg  = document.getElementById('errorMsg');
const lockoutBox= document.getElementById('lockoutBox');
const lockTimer = document.getElementById('lockTimer');
const dots      = document.getElementById('attemptDots');
const card      = document.getElementById('loginCard');
const togglePw  = document.getElementById('togglePw');
const pwInput   = document.getElementById('password');
const eyeIcon   = document.getElementById('eyeIcon');

// ── If already authenticated as a real admin, go straight to dashboard ──
(async function checkExistingSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;
  const { data: admin } = await sb
    .from('admin_users')
    .select('id')
    .eq('auth_user_id', session.user.id)
    .single();
  if (admin) {
    sessionStorage.setItem(SESSION_KEY, 'granted');
    window.location.replace('admin-dashboard.html');
  } else {
    await sb.auth.signOut();
  }
})();

// ── Check lockout on page load ─────────────────────────────────
checkLockout();

function checkLockout() {
  const now = Date.now();
  if (lockedUntil > now) {
    enterLockoutMode(Math.ceil((lockedUntil - now) / 1000));
  } else if (lockedUntil && lockedUntil <= now) {
    // Lockout expired — reset
    failedAttempts = 0;
    sessionStorage.removeItem('admin_fails');
    sessionStorage.removeItem('admin_lock');
  }
  updateDots();
}

function enterLockoutMode(secondsLeft) {
  form.querySelectorAll('input, button[type=submit]').forEach(el => el.disabled = true);
  lockoutBox.style.display = 'block';
  errorBox.style.display = 'none';
  dots.style.display = 'none';
  loginBtn.disabled = true;

  let remaining = secondsLeft;
  lockTimer.textContent = remaining;

  const iv = setInterval(() => {
    remaining--;
    lockTimer.textContent = remaining;
    if (remaining <= 0) {
      clearInterval(iv);
      // Reset
      failedAttempts = 0;
      sessionStorage.removeItem('admin_fails');
      sessionStorage.removeItem('admin_lock');
      lockedUntil = 0;
      lockoutBox.style.display = 'none';
      form.querySelectorAll('input, button[type=submit]').forEach(el => el.disabled = false);
      loginBtn.disabled = false;
      updateDots();
    }
  }, 1000);
}

function updateDots() {
  if (failedAttempts === 0) { dots.style.display = 'none'; return; }
  dots.style.display = 'flex';
  for (let i = 1; i <= 3; i++) {
    document.getElementById('dot' + i).classList.toggle('used', i <= failedAttempts);
  }
}

// ── Toggle password visibility ─────────────────────────────────
togglePw.addEventListener('click', () => {
  const isHidden = pwInput.type === 'password';
  pwInput.type = isHidden ? 'text' : 'password';
  eyeIcon.className = isHidden ? 'fas fa-eye-slash' : 'fas fa-eye';
});

// ── Clear error on typing ──────────────────────────────────────
['username', 'password'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    errorBox.style.display = 'none';
  });
});

// ── Form submit ────────────────────────────────────────────────
form.addEventListener('submit', async (e) => {
  e.preventDefault();

  // Re-check lockout (user may have submitted right as it expired)
  if (Date.now() < lockedUntil) return;

  const user = document.getElementById('username').value.trim();
  const pass = document.getElementById('password').value;

  if (!user || !pass) {
    showError('Veuillez remplir tous les champs.');
    return;
  }

  loginBtn.disabled = true;
  loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Vérification…';

  // 1. Real Supabase Auth sign-in
  const { data: authData, error: authError } = await sb.auth.signInWithPassword({
    email: user,
    password: pass
  });

  let isAdmin = false;
  if (authError) {
    console.error('[admin-login] signInWithPassword error:', authError.message);
  }
  if (!authError && authData?.user) {
    // 2. Confirm this auth user is actually listed as an admin
    const { data: admin } = await sb
      .from('admin_users')
      .select('id')
      .eq('auth_user_id', authData.user.id)
      .single();
    isAdmin = !!admin;
    if (!isAdmin) await sb.auth.signOut();
  }

  if (isAdmin) {
    // ✅ Correct — grant session and redirect
    sessionStorage.setItem(SESSION_KEY, 'granted');
    sessionStorage.removeItem('admin_fails');
    sessionStorage.removeItem('admin_lock');

    loginBtn.innerHTML = '<i class="fas fa-check-circle"></i> Accès autorisé…';
    loginBtn.style.background = 'linear-gradient(95deg,#22c55e,#16a34a)';

    await sleep(700);
    window.location.href = 'admin-dashboard.html';

  } else {
    // ❌ Wrong credentials
    failedAttempts++;
    sessionStorage.setItem('admin_fails', failedAttempts);

    updateDots();

    // Shake the card
    card.classList.remove('shake');
    void card.offsetWidth; // reflow to restart animation
    card.classList.add('shake');
    card.addEventListener('animationend', () => card.classList.remove('shake'), { once: true });

    if (failedAttempts >= MAX_TRIES) {
      // Lock out
      lockedUntil = Date.now() + LOCKOUT_SECONDS * 1000;
      sessionStorage.setItem('admin_lock', lockedUntil);
      enterLockoutMode(LOCKOUT_SECONDS);
    } else {
      const remaining = MAX_TRIES - failedAttempts;
      showError(`Identifiant ou mot de passe incorrect. ${remaining} tentative${remaining > 1 ? 's' : ''} restante${remaining > 1 ? 's' : ''}.`);
    }

    // Reset button
    loginBtn.disabled = false;
    loginBtn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Accéder au tableau de bord';
  }
});

function showError(msg) {
  errorMsg.textContent = msg;
  errorBox.style.display = 'flex';
}

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}
</script>
</body>
</html>
