<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Inscription Médecin - Jureqa</title>
<link rel="icon" href="/chismya.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/maintenance-check.js"></script>
<style>
/* ── identical to original doctor-register.html styles ── */
*{ margin:0; padding:0; box-sizing:border-box; }
body{ font-family:'Inter','Segoe UI',sans-serif; background:linear-gradient(135deg,rgba(11,61,46,0.88),rgba(6,43,32,0.85)), url('https://images.unsplash.com/photo-1576091160550-2173dba999ef?ixlib=rb-4.0.3&auto=format&fit=crop&w=2070&q=80') no-repeat center center/cover; min-height:100vh; display:flex; justify-content:center; align-items:center; padding:30px 15px; }
:root{ --med-primary:#0B3D2E; --med-primary-light:#1e6b50; --med-accent:#2c7a5e; --med-text-light:#4a5a6e; }
.register-card{ width:100%; max-width:660px; background:rgba(255,255,255,0.98); padding:44px 40px; border-radius:40px; box-shadow:0 30px 50px rgba(0,0,0,0.2); animation:fadeUp 0.6s cubic-bezier(0.2,0.9,0.4,1.1); border:1px solid rgba(11,61,46,0.1); }
.register-header{ text-align:center; margin-bottom:32px; }
.logo{ width:100px; margin-bottom:20px; filter:drop-shadow(0 4px 8px rgba(0,0,0,0.1)); border-radius:16px; display:inline-block; }
.register-header h2{ color:var(--med-primary); font-size:2rem; font-weight:800; margin-bottom:12px; }
.register-header p{ color:var(--med-text-light); line-height:1.5; font-size:0.95rem; }
.register-form{ display:flex; flex-direction:column; gap:18px; }
.input-group{ display:flex; flex-direction:column; }
.input-group label{ margin-bottom:8px; color:var(--med-primary); font-weight:700; font-size:0.9rem; display:flex; align-items:center; gap:8px; }
.input-group label i{ font-size:0.9rem; color:var(--med-accent); }
.register-form input,.register-form textarea{ width:100%; padding:14px 20px; border-radius:28px; border:1.5px solid #e2ece6; font-size:0.95rem; font-family:inherit; outline:none; transition:all 0.25s ease; }
.register-form textarea{ resize:none; min-height:110px; }
.register-form input:focus,.register-form textarea:focus{ border-color:var(--med-accent); box-shadow:0 0 0 4px rgba(44,122,94,0.12); }
.verification-note{ background:rgba(44,122,94,0.08); border:1px solid rgba(44,122,94,0.2); color:var(--med-primary); padding:16px; border-radius:24px; font-size:0.9rem; line-height:1.6; text-align:center; font-weight:500; }
.register-form button{ width:100%; padding:15px; border:none; border-radius:60px; background:linear-gradient(95deg,var(--med-accent),var(--med-primary-light)); color:white; font-size:1rem; font-weight:800; font-family:inherit; cursor:pointer; transition:all 0.3s ease; margin-top:5px; box-shadow:0 8px 20px rgba(44,122,94,0.3); display:flex; align-items:center; justify-content:center; gap:10px; }
.register-form button:hover{ transform:translateY(-2px); box-shadow:0 14px 28px rgba(44,122,94,0.4); }
.register-form button:disabled{ opacity:0.65; cursor:not-allowed; transform:none; }
.back-home{ display:block; text-align:center; margin-top:22px; color:var(--med-accent); text-decoration:none; font-weight:600; font-size:0.9rem; }
.back-home:hover{ text-decoration:underline; color:var(--med-primary); }
.login-link{ text-align:center; margin-top:16px; color:var(--med-text-light); font-size:0.9rem; font-weight:500; }
.login-link a{ color:var(--med-accent); text-decoration:none; font-weight:700; margin-left:4px; }
.success-box{ display:none; background:#dcfce7; color:#166534; padding:14px 18px; border-radius:24px; margin-bottom:22px; font-size:0.9rem; font-weight:600; border-left:4px solid #22c55e; text-align:left; }
.error-box{ display:none; background:#ffe8e8; color:#dc2626; padding:14px 18px; border-radius:24px; margin-bottom:22px; font-size:0.9rem; font-weight:600; border-left:4px solid #dc2626; text-align:left; }
@keyframes fadeUp{ from{ opacity:0; transform:translateY(30px); } to{ opacity:1; transform:translateY(0); } }
@media(max-width:480px){ .register-card{ padding:28px 20px; border-radius:28px; } .register-header h2{ font-size:1.6rem; } }
</style>
</head>
<body>
<div class="register-card">
  <div class="register-header">
    <img src="/image-removebg-preview.png" alt="Jureqa" class="logo"
      onerror="this.src='https://placehold.co/400x120/0B3D2E/white?text=Jureqa'">
    <h2>Inscription Médecin</h2>
    <p>Rejoignez Jureqa et développez<br>votre présence médicale en ligne.</p>
  </div>

  <div id="successBox" class="success-box"><i class="fas fa-check-circle"></i> <span></span></div>
  <div id="errorBox"   class="error-box"><i class="fas fa-exclamation-triangle"></i> <span></span></div>

  <form class="register-form" id="registerForm">
    <div class="input-group"><label><i class="fas fa-user"></i> Nom complet</label><input name="full_name" type="text" placeholder="Dr. Nom complet" required></div>
    <div class="input-group"><label><i class="fas fa-envelope"></i> Adresse Email</label><input name="email" type="email" placeholder="exemple@jureqa.com" required autocomplete="email"></div>
    <div class="input-group"><label><i class="fas fa-phone-alt"></i> Téléphone</label><input name="phone" type="tel" placeholder="+212 6XX XXX XXX"></div>
    <div class="input-group"><label><i class="fas fa-stethoscope"></i> Spécialité</label><input name="specialty" type="text" placeholder="Ex: Cardiologue" required></div>
    <div class="input-group"><label><i class="fas fa-id-card"></i> Numéro de licence</label><input name="license_number" type="text" placeholder="Votre numéro de licence" required></div>
    <div class="input-group"><label><i class="fas fa-city"></i> Ville</label><input name="city" type="text" placeholder="Votre ville"></div>
    <div class="input-group"><label><i class="fas fa-map-marker-alt"></i> Adresse du cabinet</label><input name="clinic_address" type="text" placeholder="Adresse du cabinet médical"></div>
    <div class="input-group"><label><i class="fas fa-align-left"></i> Description</label><textarea name="description" placeholder="Présentez votre expérience et vos services..."></textarea></div>
    <div class="input-group"><label><i class="fas fa-lock"></i> Mot de passe</label><input name="password" type="password" placeholder="Minimum 8 caractères" required autocomplete="new-password"></div>
    <div class="verification-note"><i class="fas fa-shield-check"></i> Votre licence médicale sera vérifiée par l'équipe Jureqa avant validation complète de votre compte.</div>
    <button type="submit" id="submitBtn"><i class="fas fa-arrow-right-to-bracket"></i> Créer un Compte</button>
  </form>

  <div class="login-link">Vous avez déjà un compte ?<a href="doctor-login.html">Connectez-vous ici</a></div>
  <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Retour à l'accueil</a>
</div>

<script>
const sb = window.__mednexSupabase || supabase.createClient(
  "https://xisdwbyermvbqjuqjagn.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhpc2R3Ynllcm12YnFqdXFqYWduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1MzUyOTksImV4cCI6MjA5ODExMTI5OX0.Ixz6hlLsOUkH04uNivcH81P4-MWeIc_pJZTwnAfm57I"
);

const form       = document.getElementById("registerForm");
const successBox = document.getElementById("successBox");
const errorBox   = document.getElementById("errorBox");
const submitBtn  = document.getElementById("submitBtn");

function showSuccess(msg){ successBox.querySelector("span").textContent=msg; successBox.style.display="block"; errorBox.style.display="none"; successBox.scrollIntoView({behavior:"smooth",block:"nearest"}); }
function showError(msg){ errorBox.querySelector("span").textContent=msg; errorBox.style.display="block"; successBox.style.display="none"; errorBox.scrollIntoView({behavior:"smooth",block:"nearest"}); }
function hideAlerts(){ successBox.style.display="none"; errorBox.style.display="none"; }

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  hideAlerts();

  const d = Object.fromEntries(new FormData(form).entries());
  d.full_name = d.full_name?.trim();
  d.email     = d.email?.trim();
  d.phone     = d.phone?.trim();

  // Validation
  if (!d.full_name || d.full_name.length < 3) { showError("Nom complet invalide (min 3 caractères)"); return; }
  if (!d.email || !/^[^\s@]+@([^\s@.,]+\.)+[^\s@.,]{2,}$/.test(d.email)) { showError("Email invalide"); return; }
  if (!d.specialty)       { showError("Spécialité requise"); return; }
  if (!d.license_number)  { showError("Numéro de licence requis"); return; }
  if (!d.password || d.password.length < 8) { showError("Le mot de passe doit contenir au moins 8 caractères"); return; }

  submitBtn.disabled = true;
  submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Création…';

  try {
    // The Edge Function owns the entire registration: creates the Auth
    // user, creates the doctor profile row, and rolls back cleanly if
    // anything fails partway through — none of that can be done safely
    // from the browser (see register-doctor/index.ts for why).
    const { data, error } = await sb.functions.invoke('register-doctor', {
      body: {
        full_name: d.full_name,
        email: d.email,
        phone: d.phone || null,
        specialty: d.specialty.trim(),
        license_number: d.license_number.trim(),
        city: d.city?.trim() || null,
        clinic_address: d.clinic_address?.trim() || null,
        description: d.description?.trim() || null,
        password: d.password
      }
    });

    if (error) {
      // supabase-js treats any non-2xx response from the function as
      // `error`, not `data` — the friendly message we sent (e.g. "Cet
      // email est déjà utilisé") is still in the response body, just
      // needs to be read from error.context rather than data.
      let friendlyMessage = "Erreur de connexion. Veuillez réessayer.";
      try {
        const ctx = await error.context?.json?.();
        if (ctx?.message) friendlyMessage = ctx.message;
        console.error('[doctor-register] register-doctor error:', ctx || error.message);
      } catch (_) {
        console.error('[doctor-register] register-doctor error (unparsed):', error.message);
      }
      showError(friendlyMessage);
      return;
    }

    if (data?.error) {
      // Structured, friendly error from the Edge Function itself.
      showError(data.message || "Une erreur est survenue.");
      return;
    }

    showSuccess("Compte créé ✅ Votre demande a été soumise. L'équipe Jureqa examinera votre licence et activera votre compte sous peu.");
    form.reset();
    // Don't redirect — let them read the message

  } catch (err) {
    console.error(err);
    showError("Erreur inattendue. Veuillez réessayer.");
  } finally {
    submitBtn.disabled = false;
    submitBtn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Créer un Compte';
  }
});

document.querySelectorAll(".register-form input, .register-form textarea")
  .forEach(el => el.addEventListener("focus", hideAlerts));
</script>
</body>
</html>
