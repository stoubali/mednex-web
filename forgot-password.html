<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mot de passe oublié - Jureqa</title>
<link rel="icon" href="/chismya.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/maintenance-check.js"></script>
<style>
*{ margin:0; padding:0; box-sizing:border-box; }
body{
  font-family:'Inter','Segoe UI',sans-serif;
  background:linear-gradient(135deg,rgba(11,61,46,0.88),rgba(6,43,32,0.85)),
    url('https://images.unsplash.com/photo-1576091160550-2173dba999ef?ixlib=rb-4.0.3&auto=format&fit=crop&w=2070&q=80')
    no-repeat center center/cover;
  min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px;
}
:root{
  --med-primary:#0B3D2E; --med-primary-light:#1e6b50; --med-accent:#2c7a5e;
  --med-text-light:#4a5a6e;
}
.card{
  width:100%; max-width:460px; background:rgba(255,255,255,0.98);
  border-radius:40px; padding:44px 38px;
  box-shadow:0 30px 50px rgba(0,0,0,0.2), 0 0 0 1px rgba(11,61,46,0.08);
  animation:fadeUp 0.6s cubic-bezier(0.2,0.9,0.4,1.1);
  border:1px solid rgba(11,61,46,0.1);
}
@keyframes fadeUp{ from{ opacity:0; transform:translateY(30px); } to{ opacity:1; transform:translateY(0); } }

/* Header */
.header{ text-align:center; margin-bottom:32px; }
.logo{ width:100px; margin-bottom:20px; filter:drop-shadow(0 4px 8px rgba(0,0,0,0.1)); border-radius:16px; display:inline-block; }
.icon-wrap{
  width:64px; height:64px;
  background:linear-gradient(135deg, var(--med-accent), var(--med-primary-light));
  border-radius:20px;
  display:flex; align-items:center; justify-content:center;
  margin:0 auto 18px;
  box-shadow:0 12px 28px rgba(44,122,94,0.3);
}
.icon-wrap i{ font-size:1.6rem; color:white; }
.header h2{ color:var(--med-primary); font-size:1.8rem; font-weight:800; margin-bottom:8px; letter-spacing:-0.5px; }
.header p{ color:var(--med-text-light); line-height:1.5; font-size:0.9rem; font-weight:500; }

/* Alerts */
#successBox{
  display:none; background:#dcfce7; color:#166534; padding:14px 18px; border-radius:24px;
  margin-bottom:22px; font-size:0.88rem; font-weight:600; border-left:4px solid #22c55e;
  text-align:left; line-height:1.5;
}
#errorBox{
  display:none; background:#ffe8e8; color:#dc2626; padding:14px 18px; border-radius:24px;
  margin-bottom:22px; font-size:0.88rem; font-weight:600; border-left:4px solid #dc2626; text-align:left;
}

/* Form */
.form{ display:flex; flex-direction:column; gap:20px; }
.input-group{ display:flex; flex-direction:column; }
.input-group label{ margin-bottom:8px; color:var(--med-primary); font-weight:700; font-size:0.85rem; display:flex; align-items:center; gap:8px; text-transform:uppercase; letter-spacing:0.4px; }
.input-group label i{ font-size:0.85rem; color:var(--med-accent); }
.input-group input{ width:100%; padding:15px 20px; border-radius:28px; border:1.5px solid #e2ece6; font-size:0.95rem; font-family:inherit; outline:none; transition:all 0.25s ease; background:#fafcfb; }
.input-group input:focus{ border-color:var(--med-accent); box-shadow:0 0 0 4px rgba(44,122,94,0.12); background:white; }

.submit-btn{
  width:100%; padding:15px; border:none; border-radius:60px;
  background:linear-gradient(95deg,var(--med-accent),var(--med-primary-light));
  color:white; font-size:1rem; font-weight:800; font-family:inherit; cursor:pointer;
  transition:all 0.3s ease; box-shadow:0 8px 20px rgba(44,122,94,0.3);
  display:flex; align-items:center; justify-content:center; gap:10px;
}
.submit-btn:hover{ transform:translateY(-2px); box-shadow:0 14px 28px rgba(44,122,94,0.4); }
.submit-btn:disabled{ opacity:0.65; cursor:not-allowed; transform:none; }

/* Footer links */
.links{ display:flex; flex-direction:column; align-items:center; gap:12px; margin-top:24px; }
.back-link{ color:var(--med-accent); text-decoration:none; font-weight:600; font-size:0.88rem; display:inline-flex; align-items:center; gap:6px; transition:color 0.2s; }
.back-link:hover{ color:var(--med-primary); text-decoration:underline; }

@media(max-width:480px){
  .card{ padding:28px 20px; border-radius:28px; }
  .header h2{ font-size:1.5rem; }
}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <img src="/image-removebg-preview.png" alt="Jureqa" class="logo"
      onerror="this.src='https://placehold.co/400x120/0B3D2E/white?text=Jureqa'">
    <div class="icon-wrap"><i class="fas fa-key"></i></div>
    <h2>Mot de passe oublié</h2>
    <p>Entrez votre adresse email et nous vous enverrons un lien pour réinitialiser votre mot de passe.</p>
  </div>

  <div id="successBox">
    <i class="fas fa-check-circle"></i>
    <span></span>
  </div>
  <div id="errorBox">
    <i class="fas fa-exclamation-triangle"></i>
    <span></span>
  </div>

  <div class="form" id="formSection">
    <div class="input-group">
      <label><i class="fas fa-envelope"></i> Adresse Email</label>
      <input type="email" id="email" placeholder="exemple@jureqa.com" autocomplete="email">
    </div>
    <button class="submit-btn" id="submitBtn" onclick="sendResetEmail()">
      <i class="fas fa-paper-plane"></i> Envoyer le lien
    </button>
  </div>

  <div class="links">
    <a href="doctor-login.html" class="back-link"><i class="fas fa-user-md"></i> Connexion Médecin</a>
    <a href="patient-login.html" class="back-link"><i class="fas fa-user"></i> Connexion Patient</a>
    <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Retour à l'accueil</a>
  </div>
</div>

<script>
const sb = window.__mednexSupabase || supabase.createClient(
  "https://xisdwbyermvbqjuqjagn.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhpc2R3Ynllcm12YnFqdXFqYWduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1MzUyOTksImV4cCI6MjA5ODExMTI5OX0.Ixz6hlLsOUkH04uNivcH81P4-MWeIc_pJZTwnAfm57I"
);

const successBox = document.getElementById('successBox');
const errorBox   = document.getElementById('errorBox');
const submitBtn  = document.getElementById('submitBtn');

function showSuccess(msg) {
  successBox.querySelector('span').textContent = msg;
  successBox.style.display = 'block';
  errorBox.style.display = 'none';
}
function showError(msg) {
  errorBox.querySelector('span').textContent = msg;
  errorBox.style.display = 'block';
  successBox.style.display = 'none';
}

document.getElementById('email').addEventListener('keypress', e => {
  if (e.key === 'Enter') sendResetEmail();
});
document.getElementById('email').addEventListener('input', () => {
  errorBox.style.display = 'none';
  successBox.style.display = 'none';
});

async function sendResetEmail() {
  const email = document.getElementById('email').value.trim();

  if (!email || !/^[^\s@]+@([^\s@.,]+\.)+[^\s@.,]{2,}$/.test(email)) {
    showError('Veuillez entrer une adresse email valide.');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Envoi en cours…';

  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: 'https://mednex-web.vercel.app/reset-password.html'
  });

  submitBtn.disabled = false;
  submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Envoyer le lien';

  if (error) {
    showError('Erreur: ' + error.message);
    return;
  }

  // Always show success even if email doesn't exist (security best practice)
  showSuccess(
    'Si un compte existe avec cet email, vous recevrez un lien de réinitialisation dans quelques minutes. Vérifiez aussi vos spams.'
  );

  // Hide the form after success
  document.getElementById('formSection').style.display = 'none';
}
</script>
</body>
</html>
